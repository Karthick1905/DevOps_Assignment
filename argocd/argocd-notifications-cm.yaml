apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: $slack-token

  trigger.on-health-degraded-or-outofsync: |
    - when: app.status.health.status == 'Degraded' || app.status.sync.status == 'OutOfSync'
      send: [tenanthub-app-health-alert]

  template.tenanthub-app-health-alert: |
    message: |
      :warning: ArgoCD Application Alert
      Application: {{.app.metadata.name}}
      Environment: {{index .app.metadata.labels "environment"}}
      Health: {{.app.status.health.status}}
      Sync: {{.app.status.sync.status}}
      ArgoCD URL: https://argocd.example.com/applications/{{.app.metadata.name}}
