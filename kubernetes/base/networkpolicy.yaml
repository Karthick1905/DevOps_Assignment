apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-corp-egress-restricted
  namespace: acme-corp
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.10.10.15/32
      ports:
        - protocol: TCP
          port: 5432
