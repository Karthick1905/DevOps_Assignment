apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: acme-corp-db-credentials
  namespace: acme-corp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: acme-corp-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: database
      remoteRef:
        key: tenant-acme-corp-credentials
        property: database
    - secretKey: username
      remoteRef:
        key: tenant-acme-corp-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: tenant-acme-corp-credentials
        property: password
